<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherMap</title>
  <link rel="stylesheet" href="./style/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <header>
    <div>
      <h1 class="roboto-sans"> WeatherMap</h1>
      <p class="roboto-sans">WeatherMap for location-based current Weather & and weather forecasts.</p>
    </div>
  </header>
  <div class="spacer"></div>
  <div class="spacer"></div>

  <main>
    <div>
      <form id="form" role="search">
        <input class="roboto-sans" id="city" type="text" name="Search" required>
        <button id="search" class="roboto-sans" type="submit">Get Weather</button>
        <progress id="sProgress" class="hidden"></progress>
      </form>
      <div class="spacer"></div>
      <div class="map-details">
        <div id="map"></div>
        <div id="details" class="hidden"></div>
      </div>

    </div>
  </main>

  <footer>
    <div class="spacer"></div>
  </footer>



  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAEAUTpz7JUoNoYl5Tm0K2R17IuhaWHr08&loading=async&callback=initMap&libraries=marker"
    defer>
    </script>
  <script src="./src/index.js" type="module"></script>
</body>

</html>
